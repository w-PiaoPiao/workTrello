name: 发布桌面版

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 构建（Windows，单文件 exe）
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/build_app.py

      - name: 构建（macOS，.app 并打包 zip）
        if: runner.os == 'macOS'
        run: |
          bash tools/build.sh
          cd dist
          app_name=$(ls -d peTTrello-v*.app)
          zip -r -q "${app_name%.app}.zip" "$app_name"

      - name: 创建/复用 Release 并上传（Windows）
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          for ($i = 0; $i -lt 30; $i++) {
            gh release create $tag --title "桌宠看板 $tag" --notes-file RELEASE_NOTES.md 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            gh release view $tag --json id *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          gh release view $tag --json id *> $null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          for ($i = 0; $i -lt 30; $i++) {
            # GitHub 资产名不支持中文：显式指定 ASCII 名
            gh release upload $tag dist/*.exe --clobber `
              --name "peTTrello-$tag.exe"
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }

      - name: 创建/复用 Release 并上传（macOS）
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          for i in $(seq 1 30); do
            gh release create "$TAG" --title "桌宠看板 $TAG" \
              --notes-file RELEASE_NOTES.md 2>/dev/null && break
            gh release view "$TAG" --json id >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$TAG" --json id >/dev/null 2>&1 || exit 1
          for i in $(seq 1 30); do
            # GitHub 资产名不支持中文：显式指定 ASCII 名
            gh release upload "$TAG" dist/*.zip --clobber \
              --name "peTTrello-$TAG.zip" && break
            sleep 10
          done
